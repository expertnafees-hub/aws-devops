AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Infrastructure for Nafees Ur Rehman DevOps Portfolio.
  Creates S3 SPA bucket, CloudFront CDN with OAC, and GitHub Actions OIDC IAM Role.

Parameters:
  GitHubRepo:
    Type: String
    Default: 'expertnafees-hub/aws-devops'
    Description: 'GitHub owner and repository name for OIDC subject condition (format owner/repo)'

  EnvironmentName:
    Type: String
    Default: 'production'
    Description: Environment name tag

  AlertEmail:
    Type: String
    Default: 'expertnafees@gmail.com'
    Description: 'Email address to receive CloudWatch downtime and error rate alerts'

  EnableWAF:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: 'Toggle AWS WAF v2 WebACL edge protection on CloudFront distribution for FinOps cost control'

Conditions:
  CreateWAFResources: !Equals [!Ref EnableWAF, 'true']

Resources:
  # ----------------------------------------------------------------------------
  # 1. GitHub OIDC Identity Provider
  # ----------------------------------------------------------------------------
  GitHubActionsOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: 'https://token.actions.githubusercontent.com'
      ClientIdList:
        - 'sts.amazonaws.com'
      ThumbprintList:
        - '06d927fecd0a84aeba28aad1d808139470fe95c3'
        - '2d74d6dfd96eea55ad7baafa0d3c6552b2dadc37'
        - 'ab9d0263244dd0326eb67015705a667e79cfe998'
        - '6938fd4d98bab03faadb97b34396831e3780aea1'
        - '1c58a3a8518e8759bf075b76b750d4f8d264fcd9'

  # ----------------------------------------------------------------------------
  # 2. Private S3 Bucket for Website Assets
  # ----------------------------------------------------------------------------
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'nafees-portfolio-spa-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: DevOpsPortfolio
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------------------------
  # 3. CloudFront Origin Access Control (OAC)
  # ----------------------------------------------------------------------------
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3-oac'
        Description: 'Origin Access Control for Private S3 Website Origin'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # ----------------------------------------------------------------------------
  # 4. AWS WAF v2 WebACL (Edge Defense & Rate Limiting)
  # ----------------------------------------------------------------------------
  CloudFrontWebACL:
    Type: AWS::WAFv2::WebACL
    Condition: CreateWAFResources
    Properties:
      Name: !Sub '${AWS::StackName}-cloudfront-waf'
      Description: 'Edge WAF v2 protection for CloudFront distribution - Rate Limiting and AWS Common Rule Set'
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: CloudFrontWebACLMetric
      Rules:
        - Name: RateLimit300RequestsPer5Minutes
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 300
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimit300RequestsPer5MinutesMetric
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedRulesCommonRuleSetMetric
      Tags:
        - Key: Project
          Value: DevOpsPortfolio
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------------------------
  # 5. CloudFront CDN Distribution
  # ----------------------------------------------------------------------------
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub 'Production CDN for ${GitHubRepo}'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        WebACLId: !If [CreateWAFResources, !GetAtt CloudFrontWebACL.Arn, !Ref "AWS::NoValue"]
        Origins:
          - DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            Id: S3Origin
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          MinTTL: 0
          DefaultTTL: 86400
          MaxTTL: 31536000
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
      Tags:
        - Key: Project
          Value: DevOpsPortfolio
        - Key: Environment
          Value: !Ref EnvironmentName

  # ----------------------------------------------------------------------------
  # 5. S3 Bucket Policy (OAC CloudFront Only)
  # ----------------------------------------------------------------------------
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ----------------------------------------------------------------------------
  # 6. IAM Role for GitHub Actions OIDC Deployment
  # ----------------------------------------------------------------------------
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'GitHubActions-Deploy-DevOpsPortfolio'
      Description: 'Allows GitHub Actions runner to sync S3 and invalidate CloudFront via OIDC'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !GetAtt GitHubActionsOIDCProvider.Arn
            Action: 'sts:AssumeRoleWithWebIdentity'
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': 'sts.amazonaws.com'
                'token.actions.githubusercontent.com:repository': 'expertnafees-hub/aws-devops'
              StringLike:
                'token.actions.githubusercontent.com:sub':
                  - 'repo:expertnafees-hub/aws-devops:*'
                  - 'repo:expertnafees-hub@*/aws-devops@*:*'
      Policies:
        - PolicyName: S3AndCloudFrontDeploymentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3SyncPermissions
                Effect: Allow
                Action:
                  - 's3:PutObject'
                  - 's3:GetObject'
                  - 's3:ListBucket'
                  - 's3:DeleteObject'
                Resource:
                  - !GetAtt WebsiteBucket.Arn
                  - !Sub '${WebsiteBucket.Arn}/*'
              - Sid: CloudFrontInvalidatePermissions
                Effect: Allow
                Action:
                  - 'cloudfront:CreateInvalidation'
                  - 'cloudfront:GetInvalidation'
                  - 'cloudfront:GetDistribution'
                Resource: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ----------------------------------------------------------------------------
  # 7. SRE Observability: SNS Topic & Email Subscription
  # ----------------------------------------------------------------------------
  DevOpsAlertsSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-alerts'
      DisplayName: 'DevOps Portfolio SRE Alerts'

  DevOpsAlertsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref DevOpsAlertsSNSTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ----------------------------------------------------------------------------
  # 8. SRE Observability: CloudWatch 5xx Error Rate Alarm
  # ----------------------------------------------------------------------------
  CloudFront5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-5xx-error-rate-alarm'
      AlarmDescription: 'Trigger alert if CloudFront 5xx error rate exceeds 1% in a 5-minute window'
      Namespace: AWS/CloudFront
      MetricName: 5xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref CloudFrontDistribution
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1.0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref DevOpsAlertsSNSTopic
      OKActions:
        - !Ref DevOpsAlertsSNSTopic

  # ----------------------------------------------------------------------------
  # 9. SRE Observability: CloudWatch 4xx Client Error Rate Alarm
  # ----------------------------------------------------------------------------
  CloudFront4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-4xx-error-rate-alarm'
      AlarmDescription: 'Trigger alert if CloudFront 4xx client error rate exceeds 10% in a 5-minute window'
      Namespace: AWS/CloudFront
      MetricName: 4xxErrorRate
      Dimensions:
        - Name: DistributionId
          Value: !Ref CloudFrontDistribution
        - Name: Region
          Value: Global
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10.0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref DevOpsAlertsSNSTopic
      OKActions:
        - !Ref DevOpsAlertsSNSTopic

  # ----------------------------------------------------------------------------
  # 10. SRE Observability: Executive CloudWatch Dashboard
  # ----------------------------------------------------------------------------
  CloudFrontSREDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${AWS::StackName}-sre-dashboard'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 3,
              "properties": {
                "markdown": "# 🚀 Nafees Ur Rehman — SRE Production Command Center\n**Architecture:** Amazon CloudFront CDN ➔ S3 Private Origin (OAC) | **Observability:** CloudWatch Metrics, Alarms & SNS Alerts\n*Stack:* `${AWS::StackName}` | *Region:* Global (`us-east-1`)"
              }
            },
            {
              "type": "alarm",
              "x": 0,
              "y": 3,
              "width": 12,
              "height": 4,
              "properties": {
                "title": "SRE Active Alarms (5xx & 4xx Health Status)",
                "alarms": [
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-5xx-error-rate-alarm",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${AWS::StackName}-4xx-error-rate-alarm"
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 3,
              "width": 12,
              "height": 4,
              "properties": {
                "metrics": [
                  [ "AWS/CloudFront", "Requests", "DistributionId", "${CloudFrontDistribution}", "Region", "Global", { "stat": "Sum", "label": "Total Requests" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "title": "CloudFront Global Ingress Requests",
                "period": 300
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 7,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/CloudFront", "5xxErrorRate", "DistributionId", "${CloudFrontDistribution}", "Region", "Global", { "stat": "Average", "color": "#d62728", "label": "5xx Server Error Rate (%)" } ],
                  [ ".", "4xxErrorRate", ".", ".", ".", ".", { "stat": "Average", "color": "#ff7f0e", "label": "4xx Client Error Rate (%)" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "title": "Error Rates (4xx & 5xx) Telemetry",
                "period": 300,
                "yAxis": {
                  "left": {
                    "min": 0
                  }
                }
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 7,
              "width": 12,
              "height": 6,
              "properties": {
                "metrics": [
                  [ "AWS/CloudFront", "BytesDownloaded", "DistributionId", "${CloudFrontDistribution}", "Region", "Global", { "stat": "Sum", "label": "Egress Bytes Downloaded" } ],
                  [ ".", "BytesUploaded", ".", ".", ".", ".", { "stat": "Sum", "label": "Ingress Bytes Uploaded" } ]
                ],
                "view": "timeSeries",
                "stacked": false,
                "region": "us-east-1",
                "title": "Bandwidth & Data Transfer (Bytes)",
                "period": 300
              }
            }
          ]
        }

# ------------------------------------------------------------------------------
# Outputs: Copy these values into GitHub Secrets
# ------------------------------------------------------------------------------
Outputs:
  AwsOidcRoleArn:
    Description: 'IAM Role ARN to configure in GitHub Secret AWS_OIDC_ROLE_ARN'
    Value: !GetAtt GitHubDeployRole.Arn

  AwsS3Bucket:
    Description: 'S3 Bucket name to configure in GitHub Secret AWS_S3_BUCKET'
    Value: !Ref WebsiteBucket

  AwsCloudfrontDistributionId:
    Description: 'CloudFront Distribution ID to configure in GitHub Secret AWS_CLOUDFRONT_DISTRIBUTION_ID'
    Value: !Ref CloudFrontDistribution

  LiveWebsiteUrl:
    Description: 'Your live portfolio URL (CloudFront Edge)'
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'

  SREDashboardUrl:
    Description: 'Direct AWS Console link to CloudWatch SRE Dashboard'
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AWS::StackName}-sre-dashboard'

  SnsTopicArn:
    Description: 'SNS Topic ARN for CloudWatch SRE Alerts'
    Value: !Ref DevOpsAlertsSNSTopic

  WebACLArn:
    Condition: CreateWAFResources
    Description: 'ARN of the AWS WAF v2 WebACL associated with CloudFront'
    Value: !GetAtt CloudFrontWebACL.Arn

  WebACLId:
    Condition: CreateWAFResources
    Description: 'ID of the AWS WAF v2 WebACL associated with CloudFront'
    Value: !GetAtt CloudFrontWebACL.Id
